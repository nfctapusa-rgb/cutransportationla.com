<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CU Inbox">
<title>CU Inbox</title>
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/inbox/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
 --side:#080808;--side2:#141414;--side-ink:#e9f0f0;--side-dim:#7f8f92;
 --brand:#d4af37;--brand-deep:#7a5c12;--on-brand:#0a0805;
 --bg:#eef2f3;--panel:#fff;--ink:#11191b;--dim:#6b7a7d;--line:#e3e9ea;--hover:#faf7f0;--sel:#f7efd8;--accent:#7a5c12;--warn:#c2410c;
 --disp:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--side);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hide{display:none!important}
.ic{width:1.15rem;height:1.15rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:2.5rem;padding:.4rem 1.1rem;border-radius:4px;border:0;background:var(--brand);color:var(--on-brand);font-family:var(--disp);font-weight:700;font-size:1rem;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.btn--dark{background:var(--brand-deep);color:#fff}
.btn--line{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.55;cursor:default}
.spin{width:1rem;height:1rem;border:2px solid rgba(0,0,0,.15);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- sign in ---------- */
.login{min-height:100%;display:grid;place-items:center;padding:1.5rem;background:radial-gradient(1200px 600px at 70% 0%,#2a2008,transparent),var(--side)}
.login form{width:min(380px,100%);display:grid;gap:1rem;padding:2.2rem 1.8rem;border-radius:10px;background:var(--panel);box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.login .lg{display:flex;align-items:center;gap:.8rem}
.login .lg img{width:56px;filter:invert(1) brightness(.2)}
.login h1{font-family:var(--disp);text-transform:uppercase;letter-spacing:.05em;margin:0;font-size:1.7rem;line-height:1}
.login h1 small{display:block;font-family:var(--body);text-transform:none;letter-spacing:0;font-size:.85rem;color:var(--dim);font-weight:500;margin-top:.25rem}
.field{width:100%;min-height:2.8rem;padding:.55rem .8rem;border-radius:4px;border:1px solid #cfd8da;background:#fff;font-size:16px}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(122,92,18,.15)}
.err{color:var(--warn);min-height:1.2rem;font-size:.92rem}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:232px minmax(300px,400px) minmax(0,1fr);grid-template-rows:60px minmax(0,1fr);height:100%;background:var(--bg)}
.side{grid-row:1/3;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;min-height:0;z-index:30}
.brand{display:flex;align-items:center;gap:.65rem;height:60px;padding:0 1.1rem;background:#000;border-bottom:1px solid #222}
.brand img{width:40px}
.brand b{font-family:var(--disp);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:1.05rem;line-height:1.05}
.brand b small{display:block;color:var(--brand);font-size:.78rem;letter-spacing:.12em}
.compose-btn{margin:1.1rem 1rem .6rem}
.nav{list-style:none;margin:.4rem 0;padding:0}
.nav button{display:flex;align-items:center;gap:.75rem;width:100%;padding:.7rem 1.1rem;border:0;background:transparent;color:var(--side-dim);text-align:left;border-left:3px solid transparent;font-weight:500}
.nav button:hover{color:var(--side-ink);background:var(--side2)}
.nav button[aria-current=true]{color:var(--side-ink);background:var(--side2);border-left-color:var(--brand)}
.nav .count{margin-left:auto;min-width:1.4rem;padding:0 .4rem;border-radius:999px;background:var(--brand);color:var(--on-brand);font-size:.78rem;font-weight:700;text-align:center;line-height:1.4rem}
.side .sep{height:1px;background:#222;margin:.6rem 1rem}
.side .label{padding:.4rem 1.1rem;font-family:var(--disp);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:.8rem;color:var(--brand)}
.side .contact{padding:.2rem 1.1rem;color:var(--side-dim);font-size:.9rem}
.side .contact a{color:var(--side-ink);text-decoration:none}
.side .foot span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.side .foot{margin-top:auto;padding:1rem 1.1rem;border-top:1px solid #222;display:flex;align-items:center;gap:.6rem;font-size:.85rem;color:var(--side-dim)}
.side .foot .av{width:2rem;height:2rem;font-size:.85rem}

.topbar{grid-column:2/4;display:flex;align-items:center;gap:.8rem;padding:0 1rem;background:linear-gradient(90deg,var(--brand-deep),#b8902a 60%,var(--brand));color:#fff}
.menu{display:none;border:0;background:transparent;color:#fff;padding:.4rem}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;height:2.35rem;border-radius:4px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff;padding:0 2.4rem 0 .9rem;font-size:15px}
.search input::placeholder{color:rgba(255,255,255,.8)}
.search input:focus{outline:none;background:rgba(255,255,255,.22);border-color:#fff}
.search .ic{position:absolute;right:.75rem;top:50%;transform:translateY(-50%)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:.5rem}
.tb-btn{width:2.3rem;height:2.3rem;display:grid;place-items:center;border-radius:50%;border:0;background:transparent;color:#fff}
.tb-btn:hover{background:rgba(255,255,255,.15)}
.me{display:flex;align-items:center;gap:.55rem;font-weight:600;padding-left:.4rem}

.av{width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:1rem;letter-spacing:.02em}

/* list */
.listpane{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.lhead{display:flex;align-items:center;gap:.5rem;padding:.75rem 1rem;border-bottom:1px solid var(--line)}
.lhead h2{font-family:var(--disp);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:1.15rem;margin:0}
.lhead span{color:var(--dim);font-size:.85rem}
.lhead .tools{margin-left:auto;display:flex;gap:.2rem}
.tool{width:2.2rem;height:2.2rem;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--dim)}
.tool:hover{background:var(--hover);color:var(--ink)}
.list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.1rem .8rem;padding:.85rem 1rem;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.item:hover{background:var(--hover)}
.item[aria-current=true]{background:var(--sel)}
.item .av{grid-row:1/3;width:2.4rem;height:2.4rem;font-size:.9rem}
.item .who{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .when{color:var(--dim);font-size:.8rem;white-space:nowrap;display:flex;align-items:center;gap:.35rem}
.item .line{grid-column:2/4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim);font-size:.9rem}
.item .line em{font-style:normal;color:var(--accent);font-weight:600;margin-right:.35rem}
.item.unread::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.item.unread .who{font-weight:700}
.item.unread .when b{width:.5rem;height:.5rem;border-radius:50%;background:var(--accent)}
.tag{display:inline-block;font-family:var(--disp);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.7rem;padding:.05rem .4rem;border-radius:3px;background:var(--sel);color:var(--accent);margin-right:.35rem;vertical-align:1px}
.empty{padding:2.5rem 1.2rem;color:var(--dim);text-align:center}

/* reader */
.readpane{background:var(--panel);min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.placeholder{margin:auto;color:var(--dim);text-align:center;padding:2rem;display:grid;gap:.6rem;justify-items:center}
.placeholder img{width:90px;opacity:.12;filter:invert(1)}
.reader{padding:1.6rem 1.8rem 1.2rem;display:flex;flex-direction:column;gap:1.1rem}
.rhead{display:flex;align-items:center;gap:1rem}
.rhead .av{width:3.6rem;height:3.6rem;font-size:1.3rem}
.rhead h2{margin:0;font-size:1.45rem;font-weight:600;line-height:1.15}
.rhead .addr{color:var(--dim);font-size:.9rem;word-break:break-all}
.rhead .ract{margin-left:auto;display:flex;gap:.2rem}
.subj{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.4rem 1rem;align-items:baseline}
.subj h3{margin:0;color:var(--accent);font-weight:600;font-size:1.15rem}
.subj time{color:var(--dim);font-size:.85rem}
.quick{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.75rem .9rem;border-radius:6px;background:var(--sel)}
.quick span{font-weight:600;margin-right:auto;color:var(--brand-deep)}
.quick a{min-height:2.2rem;padding:.25rem .9rem;font-size:.92rem}
.bodytext{white-space:pre-wrap;word-break:break-word;color:#3c4a4d;line-height:1.65}
.bodyhtml{width:100%;min-height:360px;border:1px solid var(--line);border-radius:6px;background:#fff}
.atts{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;color:var(--dim);font-size:.88rem;border-top:1px solid var(--line);padding-top:.9rem}
.atts span.f{padding:.35rem .7rem;border:1px solid var(--line);border-radius:4px;color:var(--ink)}
.replybox{margin:0 1.8rem 1.6rem;border-top:1px solid var(--line);padding-top:1rem;display:grid;gap:.6rem}
.replybox .modes{display:flex;gap:.3rem;color:var(--dim)}
.replybox .modes button{border:0;background:transparent;color:var(--dim);display:flex;align-items:center;gap:.35rem;padding:.3rem .55rem;border-radius:4px;font-size:.9rem}
.replybox .modes button[aria-pressed=true]{background:var(--sel);color:var(--accent);font-weight:600}
.replybox textarea{width:100%;min-height:130px;resize:vertical;border:1px solid #cfd8da;border-radius:4px;padding:.7rem .8rem;font-size:15px;line-height:1.5}
.replybox textarea:focus,.cform .field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(122,92,18,.12)}
.replybox .row{display:flex;align-items:center;gap:.6rem}
.replybox .row .to{color:var(--dim);font-size:.85rem;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cform{padding:1.6rem 1.8rem;display:grid;gap:.75rem}
.cform h2,.cform h3{margin:0;font-family:var(--disp);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.cform label{font-size:.85rem;font-weight:600;color:var(--dim)}
.cform textarea.field{min-height:220px;resize:vertical;line-height:1.5}
.back{display:none;align-self:flex-start;border:0;background:transparent;color:var(--accent);font-weight:600;align-items:center;gap:.3rem;padding:.2rem 0}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:#11191b;color:#fff;padding:.6rem 1.1rem;border-radius:999px;font-weight:600;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.scrim{display:none}

@media(max-width:1100px){.app{grid-template-columns:200px minmax(280px,340px) minmax(0,1fr)}.reader{padding:1.2rem}.replybox{margin:0 1.2rem 1.2rem}}
@media(max-width:820px){
 .app{grid-template-columns:minmax(0,1fr);grid-template-rows:56px minmax(0,1fr)}
 .side{position:fixed;inset:0 auto 0 0;width:270px;transform:translateX(-100%);transition:transform .25s ease;padding-top:env(safe-area-inset-top)}
 .app.nav-open .side{transform:none}
 .app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
 .topbar{grid-column:1;padding:0 .6rem;padding-top:env(safe-area-inset-top);gap:.4rem}
 .menu{display:grid;place-items:center}
 .me span{display:none}
 .listpane,.readpane{grid-column:1;grid-row:2}
 .app.reading .listpane{display:none}
 .app:not(.reading) .readpane{display:none}
 .back{display:inline-flex}
 .reader,.cform{padding:1rem}
 .replybox{margin:0 1rem 1.2rem}
 .rhead .ract{display:none}
}

/* ---------- first-time setup ---------- */
.ob{position:fixed;inset:0;z-index:60;background:rgba(3,8,9,.72);display:grid;place-items:center;padding:1rem;overflow-y:auto}
.ob__card{width:min(480px,100%);background:#fff;border-radius:12px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);overflow:hidden}
.ob__top{background:linear-gradient(90deg,var(--brand-deep),#b8902a 60%,var(--brand));color:#fff;padding:1.2rem 1.4rem;display:flex;align-items:center;gap:.8rem}
.ob__top img{width:44px}
.ob__top b{font-family:var(--disp);font-size:1.3rem;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.ob__top small{display:block;font-family:var(--body);text-transform:none;letter-spacing:0;font-size:.85rem;opacity:.9;font-weight:500;margin-top:.2rem}
.ob__dots{display:flex;gap:.35rem;margin-left:auto}
.ob__dots i{width:.55rem;height:.55rem;border-radius:50%;background:rgba(255,255,255,.4)}
.ob__dots i.on{background:#fff}
.ob__body{padding:1.4rem;display:grid;gap:.85rem}
.ob__body h2{margin:0;font-size:1.35rem;line-height:1.2}
.ob__body p{margin:0;color:#3c4a4d}
.ob__body label{font-size:.85rem;font-weight:600;color:var(--dim)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:.7rem}
.steps li{counter-increment:s;display:grid;grid-template-columns:2rem 1fr;gap:.7rem;align-items:start}
.steps li::before{content:counter(s);width:2rem;height:2rem;border-radius:50%;background:var(--sel);color:var(--accent);font-weight:700;display:grid;place-items:center}
.steps b{color:var(--ink)}
.kbd{display:inline-flex;align-items:center;gap:.25rem;padding:.05rem .4rem;border:1px solid var(--line);border-radius:4px;background:var(--hover);font-weight:600;white-space:nowrap}
.kbd svg{width:1rem;height:1rem}
.ob__foot{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding:0 1.4rem 1.4rem}
.ob__foot .skip{margin-left:auto;border:0;background:none;color:var(--dim);text-decoration:underline;text-underline-offset:3px}
.ok{display:flex;gap:.6rem;align-items:center;padding:.7rem .9rem;border-radius:6px;background:#e7f6ec;color:#14532d;font-weight:600}
.tip{font-size:.9rem;color:var(--dim)}
.nbar{display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem;background:#fff7ed;border-bottom:1px solid #fde4c8;color:#7c2d12;font-size:.9rem}
.nbar button{white-space:nowrap;margin-left:auto;border:0;background:var(--brand-deep);color:#fff;border-radius:4px;padding:.35rem .7rem;font-weight:600;font-size:.85rem}
.nbar .x{margin-left:.2rem;background:none;color:#7c2d12;padding:.2rem .4rem}
</style>
</head>

<!-- sign in -->
<div class="login hide" id="loginView">
 <form id="loginForm" autocomplete="on">
  <div class="lg"><img src="/assets/logo-gold.png" alt=""><h1>CU Inbox<small>Clarity Ultimate Transportation</small></h1></div>
  <input type="text" name="username" value="info@cutransportationla.com" autocomplete="username" hidden>
  <input class="field" type="password" id="pw" name="password" placeholder="Password" autocomplete="current-password" aria-label="Password" required>
  <button class="btn btn--dark" type="submit" id="loginBtn">Sign in</button>
  <div class="err" id="loginErr" role="alert"></div>
 </form>
</div>

<!-- app -->
<div class="app hide" id="appView">
 <aside class="side" id="side">
  <div class="brand"><img src="/assets/logo-gold.png" alt=""><b>Clarity Ultimate<small>Inbox</small></b></div>
  <button class="btn compose-btn" id="composeBtn"><svg class="ic"><use href="#i-pen"/></svg>Compose</button>
  <ul class="nav" role="list">
   <li><button data-f="inbox" aria-current="true"><svg class="ic"><use href="#i-inbox"/></svg>Inbox<span class="count hide" id="cInbox"></span></button></li>
   <li><button data-f="quotes"><svg class="ic"><use href="#i-quote"/></svg>Quote requests<span class="count hide" id="cQuotes"></span></button></li>
   <li><button data-f="sent"><svg class="ic"><use href="#i-sent"/></svg>Sent</button></li>
   <li><button data-f="trash"><svg class="ic"><use href="#i-trash"/></svg>Trash</button></li>
  </ul>
  <div class="sep"></div>

function step(){dots();var k=wz.steps[wz.i];({password:stepPassword,install:stepInstall,notify:stepNotify})[k]()}

function stepPassword(){$('#obSub').textContent='Step '+(wz.i+1)+' of '+wz.steps.length;var need=!state.setupPw;
 $('#obPane').innerHTML='<form class="ob__body" id="obPw" autocomplete="on"><h2 id="obTitle">Welcome, Carlos! Create your password</h2><p>This is the password you&rsquo;ll use to open your inbox. Only you will know it.</p>'+
 '<input type="text" name="username" value="info@cutransportationla.com" autocomplete="username" hidden>'+
 (need?'<label for="obCur">Setup password (the one you just used)</label><input class="field" type="password" id="obCur" autocomplete="current-password" required>':'')+
 '<label for="obNew">New password</label><input class="field" type="password" id="obNew" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">'+
 '<label for="obNew2">Type it again</label><input class="field" type="password" id="obNew2" autocomplete="new-password" minlength="8" required>'+
 '<label style="display:flex;gap:.5rem;align-items:center;font-weight:500;color:var(--ink)"><input type="checkbox" id="obShow"> Show password</label>'+
 '<div class="err" id="obErr" role="alert"></div><p class="tip">Tip: when your phone offers to save the password, tap <b>Save</b> so you never have to type it again.</p>'+
 '<button class="btn btn--dark" type="submit" id="obSave">Save my password</button></form>';
 setTimeout(function(){($('#obCur')||$('#obNew')).focus()},50);
 $('#obShow').addEventListener('change',function(e){['obNew','obNew2','obCur'].forEach(function(id){var el=$('#'+id);if(el)el.type=e.target.checked?'text':'password'})});
 $('#obPw').addEventListener('submit',function(e){e.preventDefault();var err=$('#obErr'),a=$('#obNew').value,b2=$('#obNew2').value;err.textContent='';
  if(a.length<8){err.textContent='Use at least 8 characters.';return}if(a!==b2){err.textContent='The two passwords don’t match.';return}
  var btn=$('#obSave');btn.disabled=true;btn.innerHTML='<span class="spin"></span> Saving';
  api('/api/password',{method:'POST',body:{current:state.setupPw||$('#obCur').value,next:a}}).then(function(){state.setupPw=null;
   try{if(window.PasswordCredential&&navigator.credentials){navigator.credentials.store(new PasswordCredential({id:'info@cutransportationla.com',password:a,name:'CU Inbox'})).catch(function(){})}}catch(_){}
   toast('Password saved');next()}).catch(function(e2){if(e2.message!=='auth')err.textContent=e2.message}).then(function(){if(btn.isConnected){btn.disabled=false;btn.textContent='Save my password'}})})}

function stepInstall(){$('#obSub').textContent='Step '+(wz.i+1)+' of '+wz.steps.length;var h='<div class="ob__body"><h2 id="obTitle">Put CU Inbox on your home screen</h2>';
 if(standalone()){h+='<div class="ok">&#10003; Already on your home screen</div></div>'}
 else if(isIOS&&!isIOSSafari){h+='<p>On iPhone, this works from <b>Safari</b>. Copy this link and open it in Safari:</p><p><span class="kbd">cutransportationla.com/inbox</span></p><button class="btn btn--line" id="obCopy" type="button">Copy link</button></div>'}
 else if(isIOS){h+='<p>It opens like a regular app and keeps you signed in.</p><ol class="steps">'+
  '<li><span>Tap the <span class="kbd"><svg class="ic"><use href="#i-share"/></svg>Share</span> button at the bottom of Safari.</span></li>'+
  '<li><span>Scroll down and tap <b><span class="kbd"><svg class="ic"><use href="#i-plus"/></svg>Add to Home Screen</span></b>.</span></li>'+
  '<li><span>Tap <b>Add</b> in the top right corner.</span></li>'+
  '<li><span>Open <b>CU Inbox</b> from your home screen from now on.</span></li></ol></div>'}
 else if(deferredInstall){h+='<p>Install it as an app so it opens in one tap and keeps you signed in.</p><button class="btn btn--dark" id="obInstall" type="button"><svg class="ic"><use href="#i-plus"/></svg>Add to home screen</button></div>'}
 else if(isAndroid){h+='<ol class="steps"><li><span>Tap the <span class="kbd"><svg class="ic"><use href="#i-dots"/></svg>menu</span> at the top right of Chrome.</span></li><li><span>Tap <b>Add to Home screen</b> (or <b>Install app</b>).</span></li><li><span>Tap <b>Install</b> / <b>Add</b>, then open <b>CU Inbox</b> from your home screen.</span></li></ol></div>'}
 else{h+='<p>On a computer, bookmark this page, or click the <b>install</b> icon at the right end of Chrome&rsquo;s address bar.</p><p class="tip">On your phone, open <b>cutransportationla.com/inbox</b> and come back to this screen from the menu: <b>Notifications &amp; app setup</b>.</p></div>'}
 $('#obPane').innerHTML=h+'<div class="ob__foot"><button class="btn btn--dark" id="obNext" type="button">'+(isIOS&&!standalone()?'I added it':'Next')+'</button><button class="skip" id="obSkip" type="button">Skip for now</button></div>';
 var ins=$('#obInstall');if(ins)ins.addEventListener('click',function(){deferredInstall.prompt();deferredInstall.userChoice.then(function(c){if(c.outcome==='accepted'){toast('Added to home screen');lsSet('installSeen',true);next()}});deferredInstall=null});
 var cp=$('#obCopy');if(cp)cp.addEventListener('click',function(){try{navigator.clipboard.writeText('https://cutransportationla.com/inbox');toast('Link copied')}catch(_){}});
 $('#obNext').addEventListener('click',function(){lsSet('installSeen',true);if(isIOS&&!standalone()){iosNextHint();return}next()});
 $('#obSkip').addEventListener('click',function(){lsSet('installSeen',true);next()})}
function iosNextHint(){var h='<div class="ob__body"><h2 id="obTitle">Now open it from your home screen</h2><p>Close Safari and tap the new <b>CU Inbox</b> icon. You&rsquo;ll already be signed in.</p><p>On iPhone, notifications can only be turned on from the home-screen app, so we&rsquo;ll ask you there.</p></div><div class="ob__foot"><button class="btn btn--dark" id="obOk" type="button">Got it</button></div>';
 $('#obPane').innerHTML=h;$('#obOk').addEventListener('click',function(){wz.steps=wz.steps.filter(function(s){return s!=='notify'});if(wz.i>=wz.steps.length-1){wz.i=wz.steps.length;finish()}else next()})}

function stepNotify(){$('#obSub').textContent='Step '+(wz.i+1)+' of '+wz.steps.length;var h='<div class="ob__body"><h2 id="obTitle">Turn on notifications</h2>';
 var canAsk=pushOK&&me.vapidKey&&!(isIOS&&!standalone());
 if(notifOn())h+='<div class="ok">&#10003; Notifications are on for this device</div><button class="btn btn--line" id="obTest" type="button">Send a test notification</button>';
 else if(isIOS&&!standalone())h+='<p>On iPhone, notifications work once CU Inbox is on your home screen. Add it first, then open it from the home-screen icon and tap <b>Notifications &amp; app setup</b> in the menu.</p>';
 else if(!pushOK)h+='<p>This browser can&rsquo;t show notifications. Try Chrome or Safari.</p>';
 else if(Notification.permission==='denied')h+='<p>Notifications are blocked for this site. Turn them on in your phone&rsquo;s <b>Settings</b> for '+(standalone()?'<b>CU Inbox</b>':'this browser')+', then come back here.</p>';
 else h+='<p>Get an alert on this phone when a customer emails or sends a quote request, even when the app is closed.</p><button class="btn btn--dark" id="obAllow" type="button"><svg class="ic"><use href="#i-bell"/></svg>Turn on notifications</button><p class="tip">When your phone asks, tap <b>Allow</b>.</p>';
 $('#obPane').innerHTML=h+'</div><div class="ob__foot"><button class="btn '+(canAsk&&!notifOn()?'btn--line':'btn--dark')+'" id="obNext" type="button">'+(wz.i>=wz.steps.length-1?'Done':'Next')+'</button>'+(notifOn()?'':'<button class="skip" id="obSkip" type="button">Not now</button>')+'</div>';
 var al=$('#obAllow');if(al)al.addEventListener('click',function(){al.disabled=true;al.innerHTML='<span class="spin"></span> Turning on';enablePush().then(function(){toast('Notifications on');stepNotify()}).catch(function(e){al.disabled=false;al.textContent='Turn on notifications';toast(e.message||'Could not turn on notifications')})});
 var ts=$('#obTest');if(ts)ts.addEventListener('click',function(){(swReg?Promise.resolve(swReg):navigator.serviceWorker.ready).then(function(r){r.showNotification('CU Inbox is ready',{body:'New quote requests will show up like this.',icon:'/icon-192.png'})})});
 $('#obNext').addEventListener('click',function(){lsSet('notifySeen',true);next()});var sk=$('#obSkip');if(sk)sk.addEventListener('click',function(){lsSet('notifySeen',true);next()})}
function b64ToU8(s){var p='='.repeat((4-s.length%4)%4);var b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));var a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function enablePush(){if(!me.vapidKey)return Promise.reject(new Error('Notifications are not set up on the server yet.'));
 return Notification.requestPermission().then(function(p){if(p!=='granted')throw new Error('Notifications were not allowed.');
  return swReg?swReg:navigator.serviceWorker.register('/inbox/sw.js',{scope:'/inbox'})}).then(function(r){swReg=r;return navigator.serviceWorker.ready})
 .then(function(r){return r.pushManager.getSubscription().then(function(s){return s||r.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(me.vapidKey)})})})
 .then(function(sub){return api('/api/push',{method:'POST',body:{subscription:sub.toJSON()}})}).then(function(){lsSet('pushOn',true);lsSet('notifySeen',true);updateBar()})}

/* ---- start ---- */
$('#readpane').innerHTML=placeholder();
api('/api/messages?folder=inbox&limit=1').then(showApp).catch(function(e){if(e.message!=='auth')showApp()});
function busy(){return $('#cform')||$('#pform')||($('#rtext')&&$('#rtext').value)}
setInterval(function(){if(!document.hidden&&!$('#appView').classList.contains('hide')&&!busy())load(true)},60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!$('#appView').classList.contains('hide')&&!busy())load(true)});
})();
</script>
